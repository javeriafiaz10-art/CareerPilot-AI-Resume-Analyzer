{% extends "base.html" %}

{% block content %}

<section class="welcome-section">
    <h2>Your Analysis History</h2>
    <p>Review your previous resume analysis reports.</p>
</section>

{% for r in reports %}
<div class="card history-card">

    <h3>Resume Preview</h3>
    <p>{{ r.resume_text[:150] }}...</p>

    <h4>Analysis Result</h4>
    <pre class="history-result">{{ r.result }}</pre>

</div>
{% else %}
<div class="card">
    <p>You haven't analyzed any resumes yet.</p>
</div>
{% endfor %}

{% endblock %}
